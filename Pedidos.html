<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
            <!-- Sidebar -->
        <button type="button" class="btn btn-dark rounded-circle shadow position-fixed 
            bottom-0 start-0 m-4 d-flex align-items-center justify-content-center" style="width:56px;height:56px;"
            title="Acción rápida" data-bs-toggle="offcanvas" data-bs-target="#offcanvasSide">
            <i class="bi bi-arrow-right" style="font-size:1.5rem; color:white;"></i>
        </button>
        <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSide" aria-labelledby="offcanvasExampleLabel" >
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasExampleLabel">Offcanvas</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body p-0">
                <div class="list-group list-group-flush">
                    <a href="#" class="list-group-item list-group-item-action fs-5 py-3">Dashboard</a>
                    <a href="#" class="list-group-item list-group-item-action fs-5 py-3">Pedidos</a>
                    <a href="#" class="list-group-item list-group-item-action fs-5 py-3">Productos</a>
                    <a href="#" class="list-group-item list-group-item-action fs-5 py-3">Soporte</a>
                </div>
            </div>
        </div>
    <div class="container mt-3">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Numero de Pedido</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>0001</th>
                    <th>Juan Perez</th>
                    <th>12-08-2026</th>
                    <th>2000000</th>
                    <th>En camino</th>
                    <th>
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                            data-bs-target="#verPedidoModal">Ver</button>
                        <button type="button" class="btn btn-secondary" data-bs-toggle="modal"
                            data-bs-target="#estadoPedidoModal">Actualizar Estado</button>
                        <button type="button" class="btn btn-danger" data-bs-toggle="modal"
                            data-bs-target="#delPedidoModal">Eliminar</button>
                    </th>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal Ver Pedido -->
    <div class="modal" id="verPedidoModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h4 class="modal-title">Modal Heading</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <!-- Modal body -->
                <div class="modal-body">
                    Pendiente
                </div>
                <!-- Modal footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Actualizar Estado -->
    <div class="modal" id="estadoPedidoModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h4 class="modal-title">Actualizar Estado</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <!-- Modal body -->
                <div class="modal-body">
                    <form>
                        <div class="row">
                            <div class="col">
                                <select class="form-select">
                                    <option>Pendiente</option>
                                    <option>En camino</option>
                                    <option>Entregado</option>
                                    <option>Cancelado</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <!-- Modal footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-sucess="modal">Submit</button>
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal Eliminar Pedido -->
<div class="modal" id="delPedidoModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header">
                <h4 class="modal-title">Eliminar Pedido</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <!-- Modal body -->
            <div class="modal-body">
                Estas seguro de querer proseguir
            </div>
            <!-- Modal footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-target="modal">Submit</button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
